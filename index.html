<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Terminal - Live Heatmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050a10; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            padding: 20px;
        }
        .stock-card {
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .stock-card:hover { transform: scale(1.05); filter: brightness(1.2); }
        .positive { background-color: #064e3b; border-left: 4px solid #10b981; } /* ירוק כהה */
        .negative { background-color: #7f1d1d; border-left: 4px solid #ef4444; } /* אדום כהה */
        .neutral { background-color: #1e293b; border-left: 4px solid #94a3b8; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-6 border-b border-slate-800 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-emerald-400 tracking-tighter">TECH TERMINAL</h1>
            <p class="text-slate-400 text-sm">מיון: חזקות משמאל | לחיצה לגרף TradingView</p>
        </div>
        <div id="status-tag" class="px-3 py-1 rounded-full text-xs font-bold bg-red-900/30 text-red-400 border border-red-500/50">
            ממתין לחיבור...
        </div>
    </header>

    <!-- Heatmap Grid -->
    <div id="heatmap" class="grid-container">
        <!-- הכרטיסיות ייווצרו כאן דינמית -->
    </div>

    <script>
        // *** עדכן כאן את הכתובת של ה-SPACE שלך ***
        const ws = new WebSocket('wss://dannyzzzzzz-trading-backend.hf.space/ws');
        
        const heatmap = document.getElementById('heatmap');
        const statusTag = document.getElementById('status-tag');

        function connect() {
            const ws = new WebSocket(HF_SPACE_URL);

            ws.onopen = () => {
                statusTag.innerText = "מחובר לשרת";
                statusTag.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-900/30 text-emerald-400 border border-emerald-500/50";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                renderHeatmap(data);
            };

            ws.onclose = () => {
                statusTag.innerText = "שגיאת חיבור - מנסה שוב...";
                statusTag.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-900/30 text-red-400 border border-red-500/50";
                setTimeout(connect, 3000); // ניסיון חיבור מחדש אוטומטי
            };
        }

        function renderHeatmap(stocks) {
            // מיון לפי אחוז שינוי (מהגבוה לנמוך)
            stocks.sort((a, b) => b.daily_change - a.daily_change);

            heatmap.innerHTML = '';
            stocks.forEach(stock => {
                const card = document.createElement('div');
                const isPositive = stock.daily_change >= 0;
                card.className = `stock-card p-4 rounded-lg ${isPositive ? 'positive' : 'negative'}`;
                
                // הוספת לחיצה למעבר לגרף
                card.onclick = () => window.open(`https://www.tradingview.com/symbols/${stock.ticker}`, '_blank');

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-xl font-bold">${stock.ticker}</span>
                        <span class="text-xs opacity-70">${isPositive ? '▲' : '▼'}</span>
                    </div>
                    <div class="mt-2 text-2xl font-mono">${stock.price.toFixed(2)}</div>
                    <div class="text-sm font-bold ${isPositive ? 'text-emerald-300' : 'text-red-300'}">
                        ${isPositive ? '+' : ''}${stock.daily_change.toFixed(2)}%
                    </div>
                `;
                heatmap.appendChild(card);
            });
        }

        connect();
    </script>
</body>
</html>
