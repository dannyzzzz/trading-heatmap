<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Terminal - Heatmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; font-family: system-ui, -apple-system, sans-serif; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding: 20px;
        }
        .stock-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        .stock-card:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-6 border-b border-slate-800 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-emerald-400 italic">TECH TERMINAL</h1>
            <p class="text-slate-400 text-sm">מיון: חזקות משמאל | לחיצה לגרף TradingView</p>
        </div>
        <div id="status-tag" class="px-4 py-1 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-xs font-mono">
            ממתין לנתונים...
        </div>
    </header>

    <!-- Heatmap Grid -->
    <div id="heatmap" class="grid-container">
        <!-- המניות ירונדרו כאן על ידי ה-JavaScript -->
    </div>

    <script>
        // הכתובת המעודכנת לשרת שלך ב-Render - כולל wss וסיומת /ws
        const ws = new WebSocket('wss://dannyzzzzzz-trading-backend.hf.space/ws');
        const container = document.getElementById('heatmap');
        const statusTag = document.getElementById('status-tag');

        ws.onopen = () => {
            statusTag.innerText = "מחובר לשרת - מעדכן...";
            statusTag.classList.replace('text-emerald-400', 'text-blue-400');
        };

        ws.onmessage = (event) => {
            const stocks = JSON.parse(event.data);
            renderHeatmap(stocks);
            
            const now = new Date();
            statusTag.innerText = `עודכן לאחרונה: ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
        };

        ws.onerror = (error) => {
            statusTag.innerText = "שגיאת חיבור";
            statusTag.classList.replace('text-emerald-400', 'text-red-400');
        };

        function renderHeatmap(stocks) {
            // מיון מהשינוי הגבוה לנמוך
            stocks.sort((a, b) => b.daily_change - a.daily_change);
            
            container.innerHTML = '';

            stocks.forEach(s => {
                const isPositive = s.daily_change >= 0;
                const bgColor = isPositive ? 'bg-emerald-900/40' : 'bg-red-900/40';
                const textColor = isPositive ? 'text-emerald-400' : 'text-red-400';
                const borderColor = isPositive ? 'border-emerald-500/30' : 'border-red-500/30';

                const card = document.createElement('div');
                card.className = `${bgColor} ${borderColor} border p-4 rounded-xl stock-card`;
                
                // לחיצה פותחת את הגרף ב-TradingView
                card.onclick = () => window.open(`https://www.tradingview.com/symbols/${s.ticker}`, '_blank');

                card.innerHTML = `
                    <div class="text-xs text-slate-400 font-bold mb-1">${s.ticker}</div>
                    <div class="text-xl font-mono font-bold">$${s.price.toFixed(2)}</div>
                    <div class="${textColor} text-sm font-bold mt-2">
                        ${isPositive ? '▲' : '▼'} ${Math.abs(s.daily_change).toFixed(2)}%
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
